name: foursday-work-twin
label: Foursday Work Twin
kind: standalone
version: 0.1.0
description: >
  Native Hermes composition plugin for Foursday. It assembles the personal DWS
  platform and project router
  from one profile-scoped trust boundary without patching Hermes core.
author: Foursday
provides_hooks:
  - pre_llm_call
optional_env:
  - name: FOURSDAY_PROJECT_REGISTRY
    description: "Absolute private project registry"
    prompt: "Foursday project registry"
    password: false
  - name: FOURSDAY_DWS_SIDECAR
    description: "Absolute profile-owned DWS host bridge"
    prompt: "DWS sidecar"
    password: false
  - name: FOURSDAY_MEMORY_CONTEXT_SIDECAR
    description: "Absolute profile-owned personal gbrain read bridge"
    prompt: "Memory read sidecar"
    password: false
  - name: FOURSDAY_WORK_CONTEXT_FILE
    description: "Private short-lived binding between a trusted message and Foursday MCP"
    prompt: "Foursday work context file"
    password: false
