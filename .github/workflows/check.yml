name: 检查

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: 检查-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-alpine3.23
        env:
          POSTGRES_DB: foursday_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d foursday_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: 准备锁定的 Hermes 安装回退
        run: |
          locked_commit="$(node -p "require('./distribution/upstream.lock.json').commit")"
          mkdir -p .runtime/hermes-poc/upstream
          git -C .runtime/hermes-poc/upstream init
          git -C .runtime/hermes-poc/upstream remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C .runtime/hermes-poc/upstream fetch --depth=1 origin "$locked_commit"
          git -C .runtime/hermes-poc/upstream checkout --detach FETCH_HEAD
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/foursday_test
      - run: npm run runtime:setup -- --apply
      - run: npm run check:python
      - run: npm pack --dry-run
      - run: npm run reuse:verify
